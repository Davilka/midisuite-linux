name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: System libraries (ALSA + Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            file

      - name: Determine version and tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#[vV]}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#[vV]}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          targets = {
              pathlib.Path("pyproject.toml"): (
                  r'(?m)^version = ".*"$',
                  f'version = "{version}"',
              ),
              pathlib.Path("src/midisuite/__init__.py"): (
                  r'(?m)^__version__ = ".*"$',
                  f'__version__ = "{version}"',
              ),
          }
          for path, (pattern, replacement) in targets.items():
              text = path.read_text(encoding="utf-8")
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"cannot update the version in {path}")
              path.write_text(text, encoding="utf-8")
          PY
          printf 'Building Midi Suite %s (tag %s)\n' "$VERSION" "$TAG"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build pyinstaller

      - name: Lint and unit tests
        run: |
          ruff check src tests tools
          pytest -q

      - name: GUI smoke test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication

          from midisuite.devices.smc_mixer import SmcMixer
          from midisuite.ui.app import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.mixer = SmcMixer.default()
          window.refresh_views()
          window.show()
          window.select_control("button", 0)
          app.processEvents()
          print("GUI smoke test passed")
          PY

      - name: Build wheel, sdist and standalone bundle
        env:
          MIDISUITE_UPDATE_REPO: ${{ github.repository }}
        run: scripts/build-bundle.sh "${{ steps.version.outputs.version }}"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -lh dist
          (
            cd dist
            sha256sum -c SHA256SUMS
          )
          {
            echo "### Midi Suite ${{ steps.version.outputs.version }}"
            echo
            echo "- tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo
            echo "| asset | size |"
            echo "|---|---|"
            for asset in dist/*.whl dist/midisuite_linux-*.tar.gz dist/midisuite-gui-linux-x86_64-*.tar.gz; do
              printf '| `%s` | %s |\n' "$(basename "$asset")" "$(du -h "$asset" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.whl
            dist/midisuite_linux-*.tar.gz
            dist/midisuite-gui-linux-x86_64-*.tar.gz
            dist/SHA256SUMS

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c SHA256SUMS
          )

      - name: Create or update release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Midi Suite ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            dist/*.whl
            dist/midisuite_linux-*.tar.gz
            dist/midisuite-gui-linux-x86_64-*.tar.gz
            dist/SHA256SUMS

      - name: Release summary
        run: |
          echo "Published ${{ steps.release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
