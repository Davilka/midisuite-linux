name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (ALSA + Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            file

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            v*) VERSION="${VERSION#v}" ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "empty version" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          python - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build pyinstaller

      - name: Lint and test
        run: |
          ruff check src tests tools
          pytest -q

      - name: Build wheel, sdist and standalone bundle
        env:
          MIDISUITE_UPDATE_REPO: ${{ github.repository }}
        run: scripts/build-bundle.sh "${{ steps.version.outputs.value }}"

      - name: Show artifacts
        run: ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.whl
            dist/midisuite_linux-*.tar.gz
            dist/midisuite-gui-linux-x86_64-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Midi Suite ${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            dist/*.whl
            dist/midisuite_linux-*.tar.gz
            dist/midisuite-gui-linux-x86_64-*.tar.gz
            dist/SHA256SUMS
